server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A API fica atrás de /api. O prefixo é removido antes de chegar ao Nest
  # (o front chama /api/transactions; o Nest recebe /transactions).
  # A variável + resolver fazem o nginx resolver o nome "api" a cada requisição,
  # então ele sobrevive a um restart do container da API.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos com hash no nome (assets/index-XXXX.js) nunca mudam: cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # O service worker e o manifesto precisam ser revalidados sempre, senão o app não se atualiza.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /registerSW.js { add_header Cache-Control "no-cache"; }
  # (o mime.types do nginx não conhece .webmanifest, então o tipo é declarado aqui)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Qualquer outro caminho cai no index.html (o React cuida da tela).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
